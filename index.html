<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y3S — You Experience Swag</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    header {
      padding: 25px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    nav a {
      margin-left: 15px;
      text-decoration: none;
      color: #111;
      font-size: 14px;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 20px;
    }

    .hero h1 {
      font-size: 60px;
      letter-spacing: 8px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 15px;
      letter-spacing: 4px;
      margin-bottom: 35px;
    }

    .button {
      background: #111;
      color: white;
      padding: 15px 30px;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }

    .section {
      padding: 50px 20px;
      text-align: center;
    }

    .section h2 {
      font-size: 30px;
      margin-bottom: 30px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 900px;
      margin: auto;
    }

    .product {
      border: 1px solid #ddd;
      padding: 15px;
      text-align: left;
    }

    .product-image {
      height: 220px;
      background: #eeeeee;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
      color: #777;
    }
      .product-image img {
      width: 100%;
height: 100%;
object-fit: contain;
}
    .product h3 {
      margin-bottom: 8px;
    }

    .product p {
      color: #555;
    }

    footer {
      padding: 30px;
      text-align: center;
      background: #111;
      color: white;
      margin-top: 40px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 42px;
      }

      .products {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Y3S</div>

    <nav>
      <a href="#shop">SHOP</a>
      <a href="#about">ABOUT</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Y3S</h1>
    <p>YOU EXPERIENCE SWAG</p>
    <a href="#shop" class="button">SHOP NOW</a>
  </section>

  <section class="section" id="shop">
    <h2>NEW COLLECTION</h2>

    <div class="products">

      <div class="product">
        <div class="product-image"><img src="ECCDE519-9421-47BE-999F-5E0243200FD7.png" alt="Black Y3S T-Shirt"></div>
        <h3>Y3S T-SHIRT</h3>
        <p>₦25,000</p>
      </div>

      <div class="product">
        <div class="product-image"><img src="2A8AA844-09B0-4DDC-B272-2DF9C7D3847F.png" alt="White Y3S T-Shirt"></div>
        <h3>Y3S COLLECTION</h3>
        <p>₦30,000</p>
      </div>

    </div>
  </section>

  <section class="section" id="about">
    <h2>ABOUT Y3S</h2>
    <p>YOU EXPERIENCE SWAG.</p>
  </section>

  <footer>
    © 2026 Y3S. All Rights Reserved.
  </footer>

</body>
</html>
