<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Y3S — You Experience Swag</title>

  <script src="https://js.paystack.co/v2/inline.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fff;
      color: #111;
    }

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: white;
      z-index: 100;
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 2px;
    }

    header p {
      font-size: 12px;
      margin-top: 4px;
      color: #666;
    }

    .hero {
      padding: 55px 20px;
      text-align: center;
      background: #111;
      color: white;
    }

    .hero h2 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #ccc;
    }

    .shop {
      padding: 40px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .shop h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    .product {
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
      background: white;
    }

    .product img {
      width: 100%;
      display: block;
    }

    .product-info {
      padding: 18px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 15px;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #111;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .cart-section {
      max-width: 700px;
      margin: 20px auto 60px;
      padding: 25px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #ddd;
    }

    .remove-btn {
      background: #e00;
      width: auto;
      padding: 7px 10px;
      font-size: 12px;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
    }

    .checkout {
      margin-top: 25px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #111;
      color: white;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>Y3S</h1>
  <p>YOU EXPERIENCE SWAG</p>
</header>

<section class="hero">
  <h2>YOU EXPERIENCE SWAG</h2>
  <p>Wear the experience.</p>
</section>

<section class="shop">
  <h2>SHOP Y3S</h2>

  <div class="products">

    <!-- BLACK T-SHIRT -->
    <div class="product">

      <img
        src="ECCDE519-9421-47BE-999F-5E0243200FD7.png"
        alt="Y3S Black T-Shirt"
      >

      <div class="product-info">

        <h3>Y3S BLACK T-SHIRT</h3>

        <p class="price">₦15,000</p>

        <select id="blackSize">
          <option value="">Select Size</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select>

        <button onclick="addToCart('Y3S BLACK T-SHIRT', 15000, 'blackSize')">
          ADD TO CART
        </button>

      </div>
    </div>


    <!-- WHITE T-SHIRT -->
    <div class="product">

      <img
        src="2A8AA844-09B0-4DDC-B272-2DF9C7D3847F.png"
        alt="Y3S White T-Shirt"
      >

      <div class="product-info">

        <h3>Y3S WHITE T-SHIRT</h3>

        <p class="price">₦15,000</p>

        <select id="whiteSize">
          <option value="">Select Size</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select>

        <button onclick="addToCart('Y3S WHITE T-SHIRT', 15000, 'whiteSize')">
          ADD TO CART
        </button>

      </div>
    </div>

  </div>
</section>


<section class="cart-section">

  <h2>Your Cart</h2>

  <div id="cartItems">
    <div class="empty">Your cart is empty.</div>
  </div>

  <div class="total">
    Total: ₦<span id="cartTotal">0</span>
  </div>


  <div class="checkout">

    <h2>Checkout</h2>

    <br>

    <input
      type="text"
      id="customerName"
      placeholder="Full Name"
    >

    <input
      type="email"
      id="customerEmail"
      placeholder="Email Address"
    >

    <input
      type="tel"
      id="customerPhone"
      placeholder="Phone Number"
    >

    <textarea
      id="customerAddress"
      placeholder="Delivery Address"
      rows="4"
    ></textarea>

    <button onclick="payWithPaystack()">
      PAY NOW
    </button>

  </div>

</section>


<footer>
  © 2026 Y3S — You Experience Swag
</footer>


<script>

  /* PAYSTACK SETTINGS */

  const PAYSTACK_PUBLIC_KEY =
    "pk_live_0b91b1dbd7c473a4656ed57c25ec699ea6a3d236";

  const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbxtVwfPHydVGoYNSKNOcYJrkPq8cKvkxLfFx3u4d9yS4oZ8TjAjOPRuP7Dt694aXCYN/exec";


  /* CART */

  let cart = [];


  function addToCart(name, price, sizeId) {

    const size =
      document.getElementById(sizeId).value;

    if (!size) {

      alert("Please select a size first.");

      return;
    }

    cart.push({
      name: name,
      price: price,
      size: size
    });

    updateCart();

    alert("Added to cart.");
  }


  function removeFromCart(index) {

    cart.splice(index, 1);

    updateCart();
  }


  function updateCart() {

    const cartItems =
      document.getElementById("cartItems");

    const cartTotal =
      document.getElementById("cartTotal");

    cartItems.innerHTML = "";

    if (cart.length === 0) {

      cartItems.innerHTML =
        '<div class="empty">Your cart is empty.</div>';

      cartTotal.textContent = "0";

      return;
    }

    let total = 0;


    cart.forEach((item, index) => {

      total += item.price;

      const div =
        document.createElement("div");

      div.className = "cart-item";

      div.innerHTML = `
        <div>
          <strong>${item.name}</strong><br>
          Size: ${item.size}<br>
          ₦${item.price.toLocaleString()}
        </div>

        <button
          class="remove-btn"
          onclick="removeFromCart(${index})"
        >
          Remove
        </button>
      `;

      cartItems.appendChild(div);

    });


    cartTotal.textContent =
      total.toLocaleString();
  }


  /* PAYSTACK PAYMENT */

  async function payWithPaystack() {

    if (cart.length === 0) {

      alert("Your cart is empty.");

      return;
    }


    const name =
      document.getElementById("customerName").value.trim();

    const email =
      document.getElementById("customerEmail").value.trim();

    const phone =
      document.getElementById("customerPhone").value.trim();

    const address =
      document.getElementById("customerAddress").value.trim();


    if (!name || !email || !phone || !address) {

      alert("Please fill in all your checkout details.");

      return;
    }


    const total =
      cart.reduce(
        (sum, item) => sum + item.price,
        0
      );


    try {

      const response = await fetch(
        BACKEND_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            email: email,

            amount: total * 100,

            name: name,

            phone: phone,

            address: address,

            order: cart,

            callback_url:
              window.location.href

          })
        }
      );


      const result =
        await response.json();


      if (!result.status) {

        alert(
          "Payment could not be started: " +
          (result.message ||
            "Unknown error")
        );

        return;
      }


      const popup =
        new PaystackPop();


     popup.resumeTransaction(
  result.data.access_code,
  {
    onSuccess: async (transaction) => {

      const verifyResponse = await fetch(
        BACKEND_URL,
        {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "verify",
            reference: transaction.reference
          })
        }
      );

      const verifyResult =
        await verifyResponse.json();

      if (verifyResult.status) {

        alert(
          "Payment successful! Your Y3S order has been received."
        );

        cart = [];

        updateCart();

      } else {

        alert(
          "Payment completed, but order confirmation is still processing."
        );
      }
    },

    onCancel: () => {
      console.log("Payment cancelled");
    }
  }
);


    } catch (error) {

      console.error(error);

      alert(
        "Something went wrong while connecting to Paystack. Please try again."
      );

    }

  }


  updateCart();

</script>

</body>
</html>
